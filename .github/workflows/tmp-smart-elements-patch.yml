name: One-shot smart elements integration

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-smart-elements:
    if: github.head_ref == 'feat/ddone-smart-elements-editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ddone-smart-elements-editor
          fetch-depth: 0

      - name: Integrate smart structures and clean unsupported types
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          elements = Path('src/client/components/elements-library-v2.tsx')
          text = elements.read_text()
          text = replace_once(
              text,
              'import { ensureObjectId, markSvgObject, type DDoneFabricObject } from "../canvas-model";\nimport { useEditor } from "../context";',
              'import { ensureObjectId, markSvgObject, type DDoneFabricObject } from "../canvas-model";\nimport { extractVectorPalette } from "../canvas/media-effects";\nimport { smartElementFromSource } from "../canvas/smart-elements";\nimport { useEditor } from "../context";',
              'elements import',
          )
          text = replace_once(
              text,
              '  const insertVector = useCallback(async (element: DesignElement) => {\n    if (!canvas) return;\n    const source = element.svg',
              '''  const insertVector = useCallback(async (element: DesignElement) => {
            if (!canvas) return;
            const smart = element.format === "svg" ? await smartElementFromSource(element.id, color) : null;
            if (smart) {
              const scale = Math.min((canvasWidth * 0.58) / (smart.width || 1), (canvasHeight * 0.58) / (smart.height || 1), 1.5);
              smart.set({
                left: canvasWidth / 2 - ((smart.width || 0) * scale) / 2,
                top: canvasHeight / 2 - ((smart.height || 0) * scale) / 2,
                scaleX: scale,
                scaleY: scale,
              });
              attachSourceMetadata(smart, element);
              canvas.add(smart);
              canvas.setActiveObject(smart);
              canvas.requestRenderAll();
              window.dispatchEvent(new CustomEvent("ddone:smart-element-created", { detail: { type: smart.ddoneSmartType } }));
              return;
            }
            const source = element.svg'''.replace('\n            ', '\n    '),
              'insertVector',
          )
          text = replace_once(
              text,
              '    attachSourceMetadata(object, element);\n    canvas.add(object);',
              '    attachSourceMetadata(object, element);\n    extractVectorPalette(object);\n    canvas.add(object);',
              'vector palette',
          )
          elements.write_text(text)

          tools = Path('src/client/components/tools-panel.tsx')
          text = tools.read_text()
          text = replace_once(
              text,
              'import { useEditor } from "../context";',
              'import { useEditor } from "../context";\nimport { SmartElementPanel } from "./smart-element-panel";\nimport { isSmartElement } from "../canvas/smart-elements";',
              'tools import',
          )
          text = replace_once(text, '  | "qr";', '  | "qr"\n  | "smart-element";', 'tool id')
          text = replace_once(
              text,
              '  { id: "qr", title: "QR Code", description: "QR vettoriali con colori personalizzati.", icon: QrCode, accent: "from-zinc-900 to-zinc-600" },',
              '  { id: "qr", title: "QR Code", description: "QR vettoriali con colori personalizzati.", icon: QrCode, accent: "from-zinc-900 to-zinc-600" },\n  { id: "smart-element", title: "Elemento intelligente", description: "Modifica celle, griglie e cornici mantenendo la struttura.", icon: Frame, accent: "from-violet-600 to-indigo-500" },',
              'smart tool card',
          )
          text = replace_once(
              text,
              '  const selectedImages = activeImages(canvas);',
              '  const selectedImages = activeImages(canvas);\n  const smartSelected = isSmartElement(target);',
              'smart target',
          )
          text = replace_once(
              text,
              '            const unavailable = tool.requiresImage && !selectedImage && !(tool.id === "blend" && selectedImages.length >= 2);',
              '            const unavailable = tool.id === "smart-element" ? !smartSelected : tool.requiresImage && !selectedImage && !(tool.id === "blend" && selectedImages.length >= 2);',
              'tools availability',
          )
          text = replace_once(
              text,
              '  if (activeTool === "wave") return <WaveTool canvas={canvas} canvasWidth={canvasWidth} canvasHeight={canvasHeight} onBack={onBack} />;\n  return <QrTool canvas={canvas} canvasWidth={canvasWidth} canvasHeight={canvasHeight} onBack={onBack} />;',
              '  if (activeTool === "wave") return <WaveTool canvas={canvas} canvasWidth={canvasWidth} canvasHeight={canvasHeight} onBack={onBack} />;\n  if (activeTool === "smart-element") return <SmartElementPanel />;\n  return <QrTool canvas={canvas} canvasWidth={canvasWidth} canvasHeight={canvasHeight} onBack={onBack} />;',
              'tools route',
          )
          tools.write_text(text)

          catalog = Path('src/server/elements-catalog-v2.ts')
          catalog.write_text(replace_once(
              catalog.read_text(),
              '    nextPage: unique.length > 0 ? page + 1 : null,',
              '    nextPage: unique.length >= pageSize ? page + 1 : null,',
              'pagination',
          ))

          types = Path('src/client/types.ts')
          text = types.read_text()
          text = text.replace('  | "animations"\n  | "videos"\n  | "audio"\n', '')
          text = text.replace('  | "models3d"\n', '')
          text = text.replace('export type ElementKind = "vector" | "image" | "gif" | "video" | "audio" | "model";', 'export type ElementKind = "vector" | "image";')
          text = text.replace('export type ElementFormat = "svg" | "png" | "jpg" | "webp" | "gif" | "mp4" | "mp3" | "wav" | "glb" | "gltf" | "other";', 'export type ElementFormat = "svg" | "png" | "jpg" | "webp" | "other";')
          types.write_text(text)

          obsolete = Path('src/client/components/elements-library.tsx')
          if obsolete.exists():
              obsolete.unlink()
          Path('.github/workflows/tmp-smart-elements-patch.yml').unlink(missing_ok=True)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(editor): integrate intelligent structures and strict media types"
          git push origin HEAD:feat/ddone-smart-elements-editor
