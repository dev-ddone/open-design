          status_path = Path("docs/IMPLEMENTATION_STATUS.md")
          status = status_path.read_text(encoding="utf-8")
          addition = '''\n## 2.6 static quality increment\n\n- **Verified:** element preference API persists complete favorite items, recents and collections through migration 004 and a runtime smoke test.\n- **Usable:** Smart Resize transforms the current static page into common social, print and presentation sizes.\n- **Usable:** Controllo design scans brand fonts/colors, page bounds, text size, layer naming and third-party attribution metadata.\n- **Partial:** linked campaign variants, semantic template placeholders, approvals and data-driven bulk generation remain future work.\n- **Out of scope:** video, audio, animated timeline/GIF editing and 3D.\n'''
          if "## 2.6 static quality increment" not in status:
              status += addition
          status_path.write_text(status, encoding="utf-8")

          smart_docs = Path("docs/SMART_ELEMENTS_EDITOR.md")
          smart = smart_docs.read_text(encoding="utf-8")
          smart_addition = '''\n## Static quality tools\n\nFavorites and recent items now synchronize through the authenticated preference API, with local storage used as an offline fallback. Smart Resize adapts the current page to common static formats. Controllo design audits brand consistency, page bounds, text readability, layer naming and required attribution.\n'''
          if "## Static quality tools" not in smart:
              smart += smart_addition
          smart_docs.write_text(smart, encoding="utf-8")

          workflow = Path(".github/workflows/apply-static-suite.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only

      - name: Typecheck
        run: pnpm typecheck

      - name: Regression tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit increment
        shell: bash
        run: |
          git config user.name "DDone Static Suite Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete static quality suite [static-suite]"
          git push origin HEAD:feat/ddone-smart-elements-editor
