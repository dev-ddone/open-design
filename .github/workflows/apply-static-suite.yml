name: Apply static design suite increment

on:
  push:
    branches:
      - feat/ddone-smart-elements-editor

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[static-suite]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/ddone-smart-elements-editor
          fetch-depth: 0

      - name: Apply static product increment
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content.strip() + "\n", encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              if old not in content:
                  raise RuntimeError(f"Expected text not found in {path}: {old[:100]!r}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, content, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"Expected one regex match in {path}, got {count}: {pattern}")
              target.write_text(updated, encoding="utf-8")

          write("migrations/004_element_preference_items.sql", r'''
          ALTER TABLE element_preferences
            ADD COLUMN IF NOT EXISTS favorite_items JSONB NOT NULL DEFAULT '[]'::jsonb;

          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
                FROM pg_constraint
               WHERE conname = 'element_preferences_favorite_items_array'
            ) THEN
              ALTER TABLE element_preferences
                ADD CONSTRAINT element_preferences_favorite_items_array
                CHECK (jsonb_typeof(favorite_items) = 'array');
            END IF;
          END $$;
          ''')

          write("src/server/element-preferences.ts", r'''
          import { Hono } from "hono";
          import { HTTPException } from "hono/http-exception";
          import { z } from "zod";
          import type { AppVariables } from "./auth.js";
          import { requireAuth, requireOrganization } from "./auth.js";
          import { one } from "./db.js";

          const preferences = new Hono<{ Variables: AppVariables }>();

          const elementItem = z.object({
            id: z.string().min(1).max(500),
            name: z.string().max(300),
            category: z.string().max(80),
            tags: z.array(z.string().max(100)).max(60).default([]),
            provider: z.string().max(100),
            providerLabel: z.string().max(200),
            kind: z.enum(["vector", "image"]),
            format: z.enum(["svg", "png", "jpg", "webp", "other"]).optional(),
            transparent: z.boolean().optional(),
            license: z.string().max(300),
            licenseUrl: z.string().url().max(2_000).optional(),
            author: z.string().max(500).optional(),
            sourceUrl: z.string().url().max(2_000).optional(),
            attribution: z.string().max(1_000).optional(),
            attributionRequired: z.boolean(),
            previewUrl: z.string().max(2_000).optional(),
            assetUrl: z.string().max(2_000).optional(),
            svg: z.string().max(300_000).optional(),
            width: z.number().positive().max(20_000).optional(),
            height: z.number().positive().max(20_000).optional(),
            recolorable: z.boolean().optional(),
          });

          const collection = z.object({
            id: z.string().uuid(),
            name: z.string().trim().min(1).max(80),
            elementIds: z.array(z.string().min(1).max(500)).max(500),
          });

          const payloadSchema = z.object({
            favoriteIds: z.array(z.string().min(1).max(500)).max(1_000),
            favoriteItems: z.array(elementItem).max(250).default([]),
            recentItems: z.array(elementItem).max(40),
            collections: z.array(collection).max(50).default([]),
          });

          preferences.get("/api/element-preferences", requireAuth, requireOrganization, async (c) => {
            const row = await one<{
              favorite_ids: unknown;
              favorite_items: unknown;
              recent_items: unknown;
              collections: unknown;
            }>(
              `SELECT favorite_ids, favorite_items, recent_items, collections
                 FROM element_preferences
                WHERE user_id=$1 AND organization_id=$2`,
              [c.get("user").id, c.get("organizationId")],
            );
            return c.json({
              favoriteIds: Array.isArray(row?.favorite_ids) ? row.favorite_ids : [],
              favoriteItems: Array.isArray(row?.favorite_items) ? row.favorite_items : [],
              recentItems: Array.isArray(row?.recent_items) ? row.recent_items : [],
              collections: Array.isArray(row?.collections) ? row.collections : [],
            });
          });

          preferences.put("/api/element-preferences", requireAuth, requireOrganization, async (c) => {
            const parsed = payloadSchema.safeParse(await c.req.json().catch(() => null));
            if (!parsed.success) {
              throw new HTTPException(400, {
                message: parsed.error.issues.map((issue) => issue.message).join(", "),
              });
            }
            await one(
              `INSERT INTO element_preferences(
                 user_id,organization_id,favorite_ids,favorite_items,recent_items,collections,updated_at
               ) VALUES ($1,$2,$3::jsonb,$4::jsonb,$5::jsonb,$6::jsonb,now())
               ON CONFLICT (user_id,organization_id) DO UPDATE SET
                 favorite_ids=EXCLUDED.favorite_ids,
                 favorite_items=EXCLUDED.favorite_items,
                 recent_items=EXCLUDED.recent_items,
                 collections=EXCLUDED.collections,
                 updated_at=now()
               RETURNING user_id`,
              [
                c.get("user").id,
                c.get("organizationId"),
                JSON.stringify(parsed.data.favoriteIds),
                JSON.stringify(parsed.data.favoriteItems),
                JSON.stringify(parsed.data.recentItems),
                JSON.stringify(parsed.data.collections),
              ],
            );
            return c.json({ ok: true });
          });

          export default preferences;
          ''')

          write("src/client/hooks/use-element-preferences.ts", r'''
          import { useCallback, useEffect, useRef, useState } from "preact/hooks";
          import { scopedHeaders } from "../api";
          import type { DesignElement } from "../types";

          export interface ElementCollection {
            id: string;
            name: string;
            elementIds: string[];
          }

          interface ElementPreferencesPayload {
            favoriteIds: string[];
            favoriteItems: DesignElement[];
            recentItems: DesignElement[];
            collections: ElementCollection[];
          }

          const FAVORITES_KEY = "ddone_design_element_favorites_v3";
          const FAVORITE_ITEMS_KEY = "ddone_design_element_favorite_items_v1";
          const RECENTS_KEY = "ddone_design_element_recents_v3";
          const COLLECTIONS_KEY = "ddone_design_element_collections_v1";

          function readArray<T>(key: string): T[] {
            try {
              const value = JSON.parse(localStorage.getItem(key) ?? "[]");
              return Array.isArray(value) ? value as T[] : [];
            } catch {
              return [];
            }
          }

          function uniqueIds(values: string[], maximum = 1_000): string[] {
            return [...new Set(values.filter((value) => typeof value === "string" && value.length > 0))].slice(0, maximum);
          }

          function uniqueItems(values: DesignElement[], maximum: number): DesignElement[] {
            return [...new Map(values.filter((value) => value?.id).map((value) => [value.id, value])).values()].slice(0, maximum);
          }

          export function useElementPreferences() {
            const [favoriteIds, setFavoriteIds] = useState<string[]>([]);
            const [favoriteItems, setFavoriteItems] = useState<DesignElement[]>([]);
            const [recentItems, setRecentItems] = useState<DesignElement[]>([]);
            const [collections, setCollections] = useState<ElementCollection[]>([]);
            const [loading, setLoading] = useState(true);
            const [hydrated, setHydrated] = useState(false);
            const [syncing, setSyncing] = useState(false);
            const [error, setError] = useState<string | null>(null);
            const saveTimer = useRef<number | null>(null);

            useEffect(() => {
              const controller = new AbortController();
              const load = async () => {
                const localIds = readArray<string>(FAVORITES_KEY);
                const localFavorites = readArray<DesignElement>(FAVORITE_ITEMS_KEY);
                const localRecents = readArray<DesignElement>(RECENTS_KEY);
                const localCollections = readArray<ElementCollection>(COLLECTIONS_KEY);
                try {
                  const response = await fetch("/api/element-preferences", {
                    credentials: "include",
                    headers: scopedHeaders(),
                    signal: controller.signal,
                  });
                  const data = await response.json() as Partial<ElementPreferencesPayload> & { error?: string };
                  if (!response.ok) throw new Error(data.error ?? "Preferenze non disponibili");
                  const mergedFavoriteItems = uniqueItems([
                    ...(data.favoriteItems ?? []),
                    ...localFavorites,
                    ...localRecents.filter((item) => localIds.includes(item.id)),
                  ], 250);
                  setFavoriteIds(uniqueIds([
                    ...(data.favoriteIds ?? []),
                    ...localIds,
                    ...mergedFavoriteItems.map((item) => item.id),
                  ]));
                  setFavoriteItems(mergedFavoriteItems);
                  setRecentItems(uniqueItems([...(data.recentItems ?? []), ...localRecents], 40));
                  setCollections((data.collections?.length ? data.collections : localCollections).slice(0, 50));
                  setError(null);
                } catch (caught) {
                  if ((caught as Error).name === "AbortError") return;
                  setFavoriteIds(uniqueIds([...localIds, ...localFavorites.map((item) => item.id)]));
                  setFavoriteItems(uniqueItems(localFavorites, 250));
                  setRecentItems(uniqueItems(localRecents, 40));
                  setCollections(localCollections.slice(0, 50));
                  setError(caught instanceof Error ? caught.message : "Sincronizzazione preferenze non disponibile");
                } finally {
                  if (!controller.signal.aborted) {
                    setLoading(false);
                    setHydrated(true);
                  }
                }
              };
              void load();
              return () => controller.abort();
            }, []);

            useEffect(() => {
              if (!hydrated) return;
              localStorage.setItem(FAVORITES_KEY, JSON.stringify(favoriteIds));
              localStorage.setItem(FAVORITE_ITEMS_KEY, JSON.stringify(favoriteItems));
              localStorage.setItem(RECENTS_KEY, JSON.stringify(recentItems));
              localStorage.setItem(COLLECTIONS_KEY, JSON.stringify(collections));
              if (saveTimer.current) window.clearTimeout(saveTimer.current);
              saveTimer.current = window.setTimeout(() => {
                setSyncing(true);
                void fetch("/api/element-preferences", {
                  method: "PUT",
                  credentials: "include",
                  headers: { "Content-Type": "application/json", ...scopedHeaders() },
                  body: JSON.stringify({ favoriteIds, favoriteItems, recentItems, collections }),
                })
                  .then(async (response) => {
                    if (!response.ok) {
                      const data = await response.json().catch(() => ({})) as { error?: string };
                      throw new Error(data.error ?? "Salvataggio preferenze non riuscito");
                    }
                    setError(null);
                  })
                  .catch((caught) => setError(caught instanceof Error ? caught.message : "Sincronizzazione non riuscita"))
                  .finally(() => setSyncing(false));
              }, 450);
              return () => {
                if (saveTimer.current) window.clearTimeout(saveTimer.current);
              };
            }, [hydrated, favoriteIds, favoriteItems, recentItems, collections]);

            const toggleFavorite = useCallback((element: DesignElement) => {
              setFavoriteIds((current) => current.includes(element.id)
                ? current.filter((id) => id !== element.id)
                : uniqueIds([element.id, ...current]));
              setFavoriteItems((current) => current.some((item) => item.id === element.id)
                ? current.filter((item) => item.id !== element.id)
                : uniqueItems([element, ...current], 250));
            }, []);

            const rememberRecent = useCallback((element: DesignElement) => {
              setRecentItems((current) => uniqueItems([element, ...current], 40));
            }, []);

            const createCollection = useCallback((name: string): string | null => {
              const cleanName = name.trim().slice(0, 80);
              if (!cleanName) return null;
              const id = crypto.randomUUID();
              setCollections((current) => [{ id, name: cleanName, elementIds: [] }, ...current].slice(0, 50));
              return id;
            }, []);

            const toggleCollectionElement = useCallback((collectionId: string, elementId: string) => {
              setCollections((current) => current.map((collection) => {
                if (collection.id !== collectionId) return collection;
                const contains = collection.elementIds.includes(elementId);
                return {
                  ...collection,
                  elementIds: contains
                    ? collection.elementIds.filter((id) => id !== elementId)
                    : uniqueIds([elementId, ...collection.elementIds], 500),
                };
              }));
            }, []);

            return {
              favoriteIds,
              favoriteItems,
              recentItems,
              collections,
              loading,
              syncing,
              synced: hydrated && !syncing && !error,
              error,
              toggleFavorite,
              rememberRecent,
              createCollection,
              toggleCollectionElement,
            };
          }
          ''')

          write("src/client/canvas/smart-resize.ts", r'''
          import * as fabric from "fabric";
          import type { DDoneFabricObject } from "../canvas-model";

          export type SmartResizeMode = "balanced" | "position-only" | "stretch";

          export interface StaticFormatPreset {
            id: string;
            label: string;
            width: number;
            height: number;
            group: string;
          }

          export const STATIC_FORMAT_PRESETS: StaticFormatPreset[] = [
            { id: "instagram-post", label: "Instagram post", width: 1080, height: 1080, group: "Social" },
            { id: "instagram-portrait", label: "Instagram verticale", width: 1080, height: 1350, group: "Social" },
            { id: "instagram-story", label: "Story", width: 1080, height: 1920, group: "Social" },
            { id: "facebook-cover", label: "Facebook cover", width: 1640, height: 924, group: "Social" },
            { id: "linkedin-post", label: "LinkedIn post", width: 1200, height: 627, group: "Social" },
            { id: "a4-portrait", label: "A4 verticale", width: 794, height: 1123, group: "Stampa" },
            { id: "a4-landscape", label: "A4 orizzontale", width: 1123, height: 794, group: "Stampa" },
            { id: "presentation", label: "Presentazione 16:9", width: 1920, height: 1080, group: "Presentazioni" },
          ];

          export interface SmartResizeResult {
            width: number;
            height: number;
            movedObjects: number;
            scaledObjects: number;
          }

          export function smartResizeCanvas(
            canvas: fabric.Canvas,
            fromWidth: number,
            fromHeight: number,
            toWidth: number,
            toHeight: number,
            mode: SmartResizeMode,
          ): SmartResizeResult {
            const safeFromWidth = Math.max(1, fromWidth);
            const safeFromHeight = Math.max(1, fromHeight);
            const width = Math.max(64, Math.round(toWidth));
            const height = Math.max(64, Math.round(toHeight));
            const ratioX = width / safeFromWidth;
            const ratioY = height / safeFromHeight;
            const uniformScale = Math.min(ratioX, ratioY);
            let movedObjects = 0;
            let scaledObjects = 0;

            for (const object of canvas.getObjects()) {
              const metadata = object as DDoneFabricObject;
              if (metadata._isBgImage) {
                const intrinsicWidth = Math.max(1, object.width || safeFromWidth);
                const intrinsicHeight = Math.max(1, object.height || safeFromHeight);
                const cover = Math.max(width / intrinsicWidth, height / intrinsicHeight);
                object.set({
                  left: width / 2,
                  top: height / 2,
                  originX: "center",
                  originY: "center",
                  scaleX: cover,
                  scaleY: cover,
                });
                object.setCoords();
                continue;
              }

              const center = object.getCenterPoint();
              const nextCenter = new fabric.Point(center.x * ratioX, center.y * ratioY);
              if (mode === "stretch") {
                object.set({
                  scaleX: (object.scaleX ?? 1) * ratioX,
                  scaleY: (object.scaleY ?? 1) * ratioY,
                });
                scaledObjects += 1;
              } else if (mode === "balanced") {
                object.set({
                  scaleX: (object.scaleX ?? 1) * uniformScale,
                  scaleY: (object.scaleY ?? 1) * uniformScale,
                });
                scaledObjects += 1;
              }
              object.setPositionByOrigin(nextCenter, "center", "center");
              object.setCoords();
              movedObjects += 1;
            }

            canvas.setDimensions({ width, height });
            canvas.requestRenderAll();
            for (const object of canvas.getObjects()) {
              canvas.fire("object:modified", { target: object } as any);
            }
            return { width, height, movedObjects, scaledObjects };
          }
          ''')

          write("src/client/components/smart-resize-panel.tsx", r'''
          import { useMemo, useState } from "preact/hooks";
          import { Maximize2 } from "lucide-preact";
          import { useEditor } from "../context";
          import { STATIC_FORMAT_PRESETS, smartResizeCanvas, type SmartResizeMode } from "../canvas/smart-resize";

          export function SmartResizePanel() {
            const { canvas, canvasWidth, canvasHeight, setCanvasSize } = useEditor();
            const [width, setWidth] = useState(canvasWidth);
            const [height, setHeight] = useState(canvasHeight);
            const [mode, setMode] = useState<SmartResizeMode>("balanced");
            const [message, setMessage] = useState<string | null>(null);
            const grouped = useMemo(() => [...new Set(STATIC_FORMAT_PRESETS.map((preset) => preset.group))], []);

            const apply = () => {
              if (!canvas) {
                setMessage("Apri e seleziona una pagina prima di ridimensionare.");
                return;
              }
              const result = smartResizeCanvas(canvas, canvasWidth, canvasHeight, width, height, mode);
              setCanvasSize(result.width, result.height);
              setMessage(`${result.movedObjects} elementi riposizionati, ${result.scaledObjects} ridimensionati.`);
            };

            return (
              <div class="flex flex-col gap-4">
                <div class="rounded-xl border border-violet-100 bg-violet-50 p-3">
                  <div class="mb-1 flex items-center gap-2"><Maximize2 size={16} class="text-violet-600" /><strong class="text-[11px] text-zinc-800">Smart Resize statico</strong></div>
                  <p class="m-0 text-[9px] leading-relaxed text-zinc-500">Adatta la pagina corrente mantenendo posizione relativa, proporzioni e sfondo. Non genera video o animazioni.</p>
                </div>

                {grouped.map((group) => (
                  <section key={group}>
                    <strong class="mb-2 block text-[9px] text-zinc-500">{group}</strong>
                    <div class="grid grid-cols-2 gap-2">
                      {STATIC_FORMAT_PRESETS.filter((preset) => preset.group === group).map((preset) => (
                        <button key={preset.id} onClick={() => { setWidth(preset.width); setHeight(preset.height); }} class={`rounded-xl border p-2 text-left cursor-pointer ${width === preset.width && height === preset.height ? "border-violet-500 bg-violet-50" : "border-zinc-200 bg-white hover:border-violet-300"}`}>
                          <span class="block text-[9px] font-semibold text-zinc-700">{preset.label}</span>
                          <span class="text-[8px] text-zinc-400">{preset.width} × {preset.height}</span>
                        </button>
                      ))}
                    </div>
                  </section>
                ))}

                <div class="grid grid-cols-2 gap-2">
                  <label class="text-[9px] font-semibold text-zinc-500">Larghezza<input type="number" min="64" max="10000" value={width} onInput={(event) => setWidth(Number((event.target as HTMLInputElement).value))} class="mt-1 h-9 w-full rounded-lg border border-zinc-200 px-2 text-xs outline-none focus:border-violet-400" /></label>
                  <label class="text-[9px] font-semibold text-zinc-500">Altezza<input type="number" min="64" max="10000" value={height} onInput={(event) => setHeight(Number((event.target as HTMLInputElement).value))} class="mt-1 h-9 w-full rounded-lg border border-zinc-200 px-2 text-xs outline-none focus:border-violet-400" /></label>
                </div>

                <label class="text-[9px] font-semibold text-zinc-500">Strategia
                  <select value={mode} onChange={(event) => setMode((event.target as HTMLSelectElement).value as SmartResizeMode)} class="mt-1 h-9 w-full rounded-lg border border-zinc-200 bg-white px-2 text-xs outline-none focus:border-violet-400">
                    <option value="balanced">Bilanciata: scala uniforme</option>
                    <option value="position-only">Solo layout: non scala gli oggetti</option>
                    <option value="stretch">Adatta X e Y indipendentemente</option>
                  </select>
                </label>

                <button onClick={apply} class="flex h-10 items-center justify-center gap-2 rounded-xl border-0 bg-gradient-to-r from-violet-600 to-fuchsia-500 text-xs font-semibold text-white cursor-pointer"><Maximize2 size={15} /> Applica alla pagina</button>
                {message && <p class="m-0 rounded-lg bg-zinc-50 p-2 text-[9px] text-zinc-500">{message}</p>}
              </div>
            );
          }
          ''')

          write("src/client/canvas/design-audit.ts", r'''
          import * as fabric from "fabric";
          import type { DDoneFabricObject } from "../canvas-model";
          import type { BrandKit } from "../types";

          export type AuditSeverity = "error" | "warning" | "info";

          export interface DesignAuditIssue {
            id: string;
            severity: AuditSeverity;
            category: "layout" | "brand" | "typography" | "license" | "accessibility";
            title: string;
            detail: string;
            objectId?: string;
          }

          export interface DesignAuditReport {
            score: number;
            issues: DesignAuditIssue[];
            errors: number;
            warnings: number;
            infos: number;
            checkedObjects: number;
          }

          export function normalizeDesignColor(value: unknown): string | null {
            if (typeof value !== "string") return null;
            const color = value.trim().toLowerCase();
            if (/^#[0-9a-f]{6}$/.test(color)) return color;
            if (/^#[0-9a-f]{3}$/.test(color)) return `#${color[1]}${color[1]}${color[2]}${color[2]}${color[3]}${color[3]}`;
            const rgb = /^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(color);
            if (!rgb) return null;
            return `#${[rgb[1], rgb[2], rgb[3]].map((part) => Math.max(0, Math.min(255, Number(part))).toString(16).padStart(2, "0")).join("")}`;
          }

          export function scoreAuditIssues(issues: DesignAuditIssue[]): number {
            const penalty = issues.reduce((total, issue) => total + (issue.severity === "error" ? 12 : issue.severity === "warning" ? 5 : 1), 0);
            return Math.max(0, 100 - penalty);
          }

          function isTextObject(object: fabric.FabricObject): object is fabric.Textbox | fabric.IText {
            return object instanceof fabric.Textbox || object instanceof fabric.IText || object.type === "text";
          }

          function walk(object: fabric.FabricObject, callback: (item: fabric.FabricObject, topLevel: boolean) => void, topLevel = true): void {
            callback(object, topLevel);
            if (object instanceof fabric.Group) {
              object.getObjects().forEach((child) => walk(child, callback, false));
            }
          }

          function issue(
            issues: DesignAuditIssue[],
            object: fabric.FabricObject,
            severity: AuditSeverity,
            category: DesignAuditIssue["category"],
            title: string,
            detail: string,
          ): void {
            const metadata = object as DDoneFabricObject;
            issues.push({
              id: `${category}-${metadata.ddoneId ?? object.type}-${issues.length}`,
              severity,
              category,
              title,
              detail,
              objectId: metadata.ddoneId,
            });
          }

          export function auditDesign(
            canvas: fabric.Canvas,
            canvasWidth: number,
            canvasHeight: number,
            brandKit?: BrandKit | null,
          ): DesignAuditReport {
            const issues: DesignAuditIssue[] = [];
            const allowedColors = new Set((brandKit?.colors ?? []).map(normalizeDesignColor).filter(Boolean) as string[]);
            const allowedFonts = new Set((brandKit?.fonts ?? []).map((font) => font.trim().toLowerCase()).filter(Boolean));
            const neutralColors = new Set(["#000000", "#ffffff", "#18181b", "#27272a"]);
            let checkedObjects = 0;

            for (const root of canvas.getObjects()) {
              walk(root, (object, topLevel) => {
                checkedObjects += 1;
                const metadata = object as DDoneFabricObject;
                if (topLevel && object.visible !== false && !metadata._isBgImage) {
                  const bounds = object.getBoundingRect();
                  const completelyOutside = bounds.left + bounds.width < 0
                    || bounds.top + bounds.height < 0
                    || bounds.left > canvasWidth
                    || bounds.top > canvasHeight;
                  const partiallyOutside = bounds.left < 0
                    || bounds.top < 0
                    || bounds.left + bounds.width > canvasWidth
                    || bounds.top + bounds.height > canvasHeight;
                  if (completelyOutside) issue(issues, object, "error", "layout", "Elemento fuori pagina", "L’elemento non è visibile nell’area esportata.");
                  else if (partiallyOutside) issue(issues, object, "warning", "layout", "Elemento tagliato", "Una parte dell’elemento supera i bordi della pagina.");
                }

                if (isTextObject(object)) {
                  const text = object as fabric.Textbox;
                  const fontSize = Number(text.fontSize ?? 0) * Math.abs(text.scaleY ?? 1);
                  if (fontSize > 0 && fontSize < 12) issue(issues, object, "warning", "accessibility", "Testo molto piccolo", `Dimensione visiva circa ${Math.round(fontSize)} px.`);
                  const font = String(text.fontFamily ?? "").trim().toLowerCase();
                  if (allowedFonts.size > 0 && font && !allowedFonts.has(font)) issue(issues, object, "warning", "typography", "Font fuori brand", `${text.fontFamily} non appartiene al brand kit attivo.`);
                  if (!String(text.text ?? "").trim()) issue(issues, object, "info", "accessibility", "Testo vuoto", "Rimuovi il livello oppure inserisci il contenuto previsto.");
                }

                if (!(object instanceof fabric.FabricImage) && allowedColors.size > 0) {
                  for (const value of [(object as any).fill, (object as any).stroke]) {
                    const color = normalizeDesignColor(value);
                    if (color && !allowedColors.has(color) && !neutralColors.has(color)) {
                      issue(issues, object, "warning", "brand", "Colore fuori brand", `${color} non è presente nel brand kit attivo.`);
                      break;
                    }
                  }
                }

                if (object instanceof fabric.FabricImage && !metadata.ddoneName?.trim()) {
                  issue(issues, object, "info", "accessibility", "Immagine senza nome livello", "Assegna un nome descrittivo dal pannello Livelli.");
                }

                if (metadata.ddoneAttributionRequired) {
                  if (!metadata.ddoneLicense || !metadata.ddoneSourceUrl) {
                    issue(issues, object, "error", "license", "Attribuzione incompleta", "La risorsa richiede attribuzione ma fonte o licenza non sono disponibili.");
                  } else if (!metadata.ddoneAttribution && !metadata.ddoneAuthor) {
                    issue(issues, object, "warning", "license", "Autore non indicato", "Conserva autore o testo di attribuzione prima della pubblicazione.");
                  }
                }
              });
            }

            if (canvas.getObjects().length === 0) {
              issues.push({ id: "layout-empty", severity: "info", category: "layout", title: "Pagina vuota", detail: "Aggiungi contenuti prima dell’esportazione." });
            }
            const errors = issues.filter((item) => item.severity === "error").length;
            const warnings = issues.filter((item) => item.severity === "warning").length;
            const infos = issues.filter((item) => item.severity === "info").length;
            return { score: scoreAuditIssues(issues), issues, errors, warnings, infos, checkedObjects };
          }
