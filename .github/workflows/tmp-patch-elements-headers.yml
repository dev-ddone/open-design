name: One-shot Elements header patch

on:
  push:
    branches:
      - feat/ddone-pro-elements-canvas-ux
    paths:
      - .github/workflows/tmp-patch-elements-headers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ddone-pro-elements-canvas-ux
          fetch-depth: 0
      - name: Apply typed header patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/server/elements-universe.ts')
          text = path.read_text()
          old = 'const headers = config.elements.sketchfabToken ? { Authorization: `Token ${config.elements.sketchfabToken}` } : {};'
          new = 'const headers: Record<string, string> = config.elements.sketchfabToken ? { Authorization: `Token ${config.elements.sketchfabToken}` } : {};'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 header declarations, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/elements-universe.ts
          git commit -m "fix(elements): type optional Sketchfab headers"
          git push origin HEAD:feat/ddone-pro-elements-canvas-ux
