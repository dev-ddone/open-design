name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-local-pack-search:
    if: github.head_ref == 'feat/ddone-pro-elements-canvas-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ddone-pro-elements-canvas-ux
          fetch-depth: 0

      - name: Make local pack search token based and restore CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/server/local-asset-packs.ts')
          text = path.read_text()
          old = '    .filter((item) => !needle || normalizeQuery([item.name, ...item.tags].join(" ")).includes(needle))'
          new = '''    .filter((item) => {
                if (!needle) return true;
                const haystack = normalizeQuery([item.name, ...item.tags].join(" "));
                return needle.split(/\\s+/).filter(Boolean).every((term) => haystack.includes(term));
              })'''.replace('              ', '')
          if old not in text:
              raise SystemExit('Expected structural search filter was not found')
          text = text.replace(old, new, 1)
          text = text.replace('  tabelle: "table",', '  tabelle: "table",\n  prezzo: "price",\n  prezzi: "prices",\n  listino: "price list",', 1)
          path.write_text(text)
          PY

          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/local-asset-packs.ts .github/workflows/ci.yml
          git commit -m "fix(elements): search bundled packs by independent terms"
          git push origin HEAD:feat/ddone-pro-elements-canvas-ux
