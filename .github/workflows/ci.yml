name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/ddone-platform-foundation

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log

      - name: Build frontend
        id: frontend-build
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee frontend-build.log

      - name: Build production image
        id: docker-build
        shell: bash
        run: |
          set -o pipefail
          docker build -t ddone-open-design:ci . 2>&1 | tee docker-build.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            typecheck.log
            frontend-build.log
            docker-build.log
          if-no-files-found: ignore
          retention-days: 3
