name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/ddone-platform-foundation

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

      - name: Build production image
        run: docker build -t ddone-open-design:ci .
