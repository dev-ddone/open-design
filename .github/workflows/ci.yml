name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-local-aliases:
    if: github.head_ref == 'feat/ddone-pro-elements-canvas-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ddone-pro-elements-canvas-ux
          fetch-depth: 0

      - name: Add restaurant aliases and restore CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/server/local-asset-packs.ts')
          text = path.read_text()
          old = '  tabelle: "table",'
          new = '  tabelle: "table",\n  ristorante: "restaurant",\n  ristoranti: "restaurant",'
          if old not in text:
              raise SystemExit('Expected alias anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/local-asset-packs.ts .github/workflows/ci.yml
          git commit -m "fix(elements): normalize restaurant terms in local packs"
          git push origin HEAD:feat/ddone-pro-elements-canvas-ux
