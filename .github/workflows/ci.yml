name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/ddone-platform-foundation
      - feat/ddone-advanced-suite
      - feat/ddone-elements-universe

permissions:
  contents: write

jobs:
  patch-professional-finish:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/ddone-smart-elements-editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ddone-smart-elements-editor
          fetch-depth: 0
      - name: Apply synchronized preferences and non-destructive effects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          path = Path('src/client/components/elements-library-v2.tsx')
          text = path.read_text()
          if 'preferencesLoaded = useRef' not in text:
              text = once(text,
                  'import { useCallback, useEffect, useMemo, useState } from "preact/hooks";',
                  'import { useCallback, useEffect, useMemo, useRef, useState } from "preact/hooks";',
                  'preferences hook import')
              text = once(text,
                  '  const [importingId, setImportingId] = useState<string | null>(null);',
                  '''  const [importingId, setImportingId] = useState<string | null>(null);
  const preferencesLoaded = useRef(false);
  const preferencesTimer = useRef<number | null>(null);''',
                  'preferences state')
              anchor = '''  useEffect(() => {
    const controller = new AbortController();
    const timer = window.setTimeout(() => void runSearch(1, false, controller.signal), 50);
    return () => {
      window.clearTimeout(timer);
      controller.abort();
    };
  }, [runSearch]);'''
              addition = anchor + '''

  useEffect(() => {
    let cancelled = false;
    void fetch("/api/element-preferences", { credentials: "include", headers: scopedHeaders() })
      .then(async (response) => {
        if (!response.ok) throw new Error("Preferences unavailable");
        return response.json() as Promise<{ favoriteIds?: string[]; recentItems?: DesignElement[] }>;
      })
      .then((data) => {
        if (cancelled) return;
        if (Array.isArray(data.favoriteIds)) {
          setFavorites(data.favoriteIds);
          writeIds(FAVORITES_KEY, data.favoriteIds);
        }
        if (Array.isArray(data.recentItems)) {
          setRecents(data.recentItems);
          writeRecentItems(data.recentItems);
        }
      })
      .catch(() => undefined)
      .finally(() => {
        if (!cancelled) preferencesLoaded.current = true;
      });
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    if (!preferencesLoaded.current) return;
    if (preferencesTimer.current) window.clearTimeout(preferencesTimer.current);
    preferencesTimer.current = window.setTimeout(() => {
      void fetch("/api/element-preferences", {
        method: "PUT",
        credentials: "include",
        headers: { ...scopedHeaders(), "Content-Type": "application/json" },
        body: JSON.stringify({ favoriteIds: favorites, recentItems: recents, collections: [] }),
      }).catch(() => undefined);
    }, 450);
    return () => {
      if (preferencesTimer.current) window.clearTimeout(preferencesTimer.current);
    };
  }, [favorites, recents]);'''
              text = once(text, anchor, addition, 'preferences effects')
              path.write_text(text)

          path = Path('src/client/components/tools-panel.tsx')
          text = path.read_text()
          if 'hideSources, setHideSources' not in text:
              text = once(text,
                  '  const [opacity, setOpacity] = useState(0.72);',
                  '  const [opacity, setOpacity] = useState(0.72);\n  const [hideSources, setHideSources] = useState(true);',
                  'blend option')
              text = once(text,
                  '''      const result = await blendImages(images[0], images[1], mode, opacity);
      canvas.add(result);''',
                  '''      const firstId = ensureObjectId(images[0]);
      const secondId = ensureObjectId(images[1]);
      const result = await blendImages(images[0], images[1], mode, opacity);
      const metadata = result as DDoneFabricObject;
      metadata.ddoneEffectSourceId = `${firstId},${secondId}`;
      metadata.ddoneEffectConfig = JSON.stringify({ mode, opacity, hideSources });
      if (hideSources) {
        for (const image of images.slice(0, 2)) image.set({ visible: false, selectable: false, evented: false });
      }
      canvas.add(result);''',
                  'blend preserve')
              text = once(text,
                  '      <div class="mb-4"><Slider label="Intensità seconda immagine" value={opacity} min={0} max={1} step={0.01} onInput={setOpacity} /></div>\n      <PrimaryButton',
                  '      <div class="mb-4"><Slider label="Intensità seconda immagine" value={opacity} min={0} max={1} step={0.01} onInput={setOpacity} /></div>\n      <label class="mb-4 flex items-center gap-2 text-[10px] text-zinc-600"><input type="checkbox" checked={hideSources} onChange={(event) => setHideSources((event.target as HTMLInputElement).checked)} /> Nascondi gli originali senza eliminarli</label>\n      <PrimaryButton',
                  'blend ui')
              text = once(text,
                  '  const [softness, setSoftness] = useState(0.35);',
                  '  const [softness, setSoftness] = useState(0.35);\n  const [preserveOriginal, setPreserveOriginal] = useState(true);',
                  'dissolve option')
              text = once(text,
                  '''      Object.assign(result as DDoneFabricObject, {
        ddoneProvider: source.ddoneProvider,
        ddoneSourceUrl: source.ddoneSourceUrl,
        ddoneLicense: source.ddoneLicense,
        ddoneAuthor: source.ddoneAuthor,
      });
      replaceObject(canvas, image, result);''',
                  '''      const sourceId = ensureObjectId(image);
      Object.assign(result as DDoneFabricObject, {
        ddoneProvider: source.ddoneProvider,
        ddoneSourceUrl: source.ddoneSourceUrl,
        ddoneLicense: source.ddoneLicense,
        ddoneAuthor: source.ddoneAuthor,
        ddoneEffectSourceId: sourceId,
        ddoneEffectConfig: JSON.stringify({ mode, direction, softness, preserveOriginal }),
      });
      if (preserveOriginal) {
        const index = canvas.getObjects().indexOf(image);
        image.set({ visible: false, selectable: false, evented: false });
        canvas.add(result);
        if (index >= 0) (canvas as any).moveObjectTo?.(result, index + 1);
        canvas.setActiveObject(result);
        canvas.requestRenderAll();
        canvas.fire("object:modified", { target: result } as any);
      } else {
        replaceObject(canvas, image, result);
      }''',
                  'dissolve preserve')
              text = once(text,
                  '      <div class="mb-4"><Slider label="Morbidezza" value={softness} min={0.05} max={0.95} step={0.01} onInput={setSoftness} /></div>\n      <PrimaryButton',
                  '      <div class="mb-4"><Slider label="Morbidezza" value={softness} min={0.05} max={0.95} step={0.01} onInput={setSoftness} /></div>\n      <label class="mb-4 flex items-center gap-2 text-[10px] text-zinc-600"><input type="checkbox" checked={preserveOriginal} onChange={(event) => setPreserveOriginal((event.target as HTMLInputElement).checked)} /> Conserva l’immagine originale nascosta</label>\n      <PrimaryButton',
                  'dissolve ui')
              path.write_text(text)

          Path('.github/workflows/tmp-professional-finish.yml').unlink(missing_ok=True)
          PY
          git show origin/feat/ddone-pro-elements-canvas-ux:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(editor): sync preferences and preserve effect sources"
          git push origin HEAD:feat/ddone-smart-elements-editor

  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: open_design
          POSTGRES_PASSWORD: open_design
          POSTGRES_DB: open_design
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_design -d open_design"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      PORT: 3006
      APP_URL: http://127.0.0.1:3006
      DATABASE_URL: postgresql://open_design:open_design@127.0.0.1:5432/open_design
      JWT_SECRET: ci-only-jwt-secret-with-more-than-thirty-two-characters
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: ./data/ci-uploads
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password
      BOOTSTRAP_ADMIN_NAME: CI Administrator
      BOOTSTRAP_ORGANIZATION_NAME: CI Workspace
      REGISTRATION_ENABLED: "true"
      EMAIL_DELIVERY: log
      EMAIL_FROM: DDone CI <noreply@example.com>
      PASSWORD_RESET_TTL_MINUTES: "30"
      INVITATION_TTL_HOURS: "72"
      ELEMENTS_PROVIDERS: builtin,uploads,iconify,openverse,wikimedia
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log

      - name: Openverse OAuth2 token lifecycle smoke test
        id: openverse-auth-smoke
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx scripts/openverse-auth-smoke.ts 2>&1 | tee openverse-auth-smoke.log

      - name: Build frontend
        id: frontend-build
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee frontend-build.log

      - name: Runtime API, account and realtime smoke tests
        id: runtime-smoke
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > runtime.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3006/health > health.json; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat runtime.log
              exit 1
            fi
            sleep 1
          done
          jq -e '.status == "ok"' health.json

          curl --fail --silent --show-error \
            --cookie-jar cookies.txt \
            --header 'Content-Type: application/json' \
            --data '{"email":"admin@example.com","password":"ci-admin-password"}' \
            http://127.0.0.1:3006/api/auth/login > login.json
          ORGANIZATION_ID=$(jq -er '.organizations[0].id' login.json)

          curl --fail --silent --show-error \
            --cookie cookies.txt \
            --header "X-Organization-ID: ${ORGANIZATION_ID}" \
            --header 'Content-Type: application/json' \
            --data '{"name":"Smoke Test Client"}' \
            http://127.0.0.1:3006/api/clients > client.json
          CLIENT_ID=$(jq -er '.id' client.json)

          curl --fail --silent --show-error \
            --cookie cookies.txt \
            --header "X-Organization-ID: ${ORGANIZATION_ID}" \
            --header "X-Client-ID: ${CLIENT_ID}" \
            --header 'Content-Type: application/json' \
            --data "{\"name\":\"Smoke Test Design\",\"client_id\":\"${CLIENT_ID}\"}" \
            http://127.0.0.1:3006/api/designs > design.json
          jq -e '.name == "Smoke Test Design"' design.json

          curl --fail --silent --show-error \
            --cookie cookies.txt \
            --header "X-Organization-ID: ${ORGANIZATION_ID}" \
            'http://127.0.0.1:3006/api/elements/search?category=ornaments&q=floral' > elements.json
          jq -e 'length > 0' elements.json

          cat > safe.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <defs><linearGradient id="g"><stop stop-color="#6d5dfc"/><stop offset="1" stop-color="#171717"/></linearGradient></defs>
            <circle cx="50" cy="50" r="40" fill="url(#g)"/>
          </svg>
          SVG
          curl --fail --silent --show-error \
            --cookie cookies.txt \
            --header "X-Organization-ID: ${ORGANIZATION_ID}" \
            --header "X-Client-ID: ${CLIENT_ID}" \
            --form "client_id=${CLIENT_ID}" \
            --form 'file=@safe.svg;type=image/svg+xml' \
            http://127.0.0.1:3006/api/uploads > upload.json
          ASSET_URL=$(jq -er '.url' upload.json)
          curl --fail --silent --show-error \
            --cookie cookies.txt \
            --header "X-Organization-ID: ${ORGANIZATION_ID}" \
            --header "X-Client-ID: ${CLIENT_ID}" \
            "http://127.0.0.1:3006${ASSET_URL}" > downloaded.svg
          grep -q '<svg' downloaded.svg

          curl --fail --silent --show-error http://127.0.0.1:3006/ > home.html
          grep -q '<div id="app"></div>' home.html

          node scripts/realtime-smoke.mjs cookies.txt design.json 2>&1 | tee realtime-smoke.log
          node scripts/advanced-api-smoke.mjs 2>&1 | tee advanced-api-smoke.log
          node scripts/template-application-smoke.mjs 2>&1 | tee template-application-smoke.log
          node scripts/elements-universe-smoke.mjs cookies.txt login.json client.json 2>&1 | tee elements-universe-smoke.log

      - name: Build production image
        id: docker-build
        shell: bash
        run: |
          set -o pipefail
          docker build -t ddone-open-design:ci . 2>&1 | tee docker-build.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            pnpm-lock.yaml
            typecheck.log
            openverse-auth-smoke.log
            frontend-build.log
            runtime.log
            realtime-smoke.log
            advanced-api-smoke.log
            template-application-smoke.log
            elements-universe-smoke.log
            health.json
            login.json
            client.json
            design.json
            elements.json
            upload.json
            docker-build.log
          if-no-files-found: ignore
          retention-days: 3
